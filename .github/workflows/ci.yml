# Chapter 31 of Book 3: closes the same real, disclosed CI gap named in
# chapter 11 of this book across all three products, a live/integration
# tier job that never actually existed until now.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  fast-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest tests/unit tests/orchestration -v

  integration-tests:
    runs-on: ubuntu-latest
    needs: fast-tests
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: pkgintel_app
          POSTGRES_PASSWORD: pkgintel_app
          POSTGRES_DB: pkgintel_app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pkgintel_app"
          --health-interval 5s --health-timeout 5s --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.19.0
        ports: ["6333:6333"]
      neo4j:
        image: neo4j:2026.08.1
        env:
          NEO4J_AUTH: neo4j/reliable-agents-labs
        ports: ["7687:7687"]
    env:
      DATABASE_URL: postgresql://pkgintel_app:pkgintel_app@localhost:5432/pkgintel_app
      QDRANT_URL: http://localhost:6333
      NEO4J_URI: bolt://localhost:7687
      NEO4J_PASSWORD: reliable-agents-labs
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      - run: uv run python scripts/migrate.py
      - run: uv run pytest tests/integration -v
