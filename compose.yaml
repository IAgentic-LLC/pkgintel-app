services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: pkgintel_app
      POSTGRES_PASSWORD: pkgintel_app
      POSTGRES_DB: pkgintel_app
    ports:
      # 5434, not 5432 or reorder-app's own 5433: both repos' Postgres
      # containers can run at the same time on this machine without
      # colliding.
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pkgintel_app"]
      interval: 2s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:2026.08.1
    environment:
      NEO4J_AUTH: neo4j/reliable-agents-labs
    ports:
      # 7688/7475, not Neo4j's default 7687/7474: reliable-agents-labs'
      # own graph_store.py already defaults to bolt://localhost:7688,
      # the exact same remapping reasoning as Postgres above.
      - "7688:7687"
      - "7475:7474"
    volumes:
      - neo4j-data:/data

volumes:
  qdrant-data:
  neo4j-data:
