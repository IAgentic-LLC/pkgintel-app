[project]
name = "pkgintel-app"
version = "0.1.0"
description = "Full-stack product: the package dependency intelligence assistant, hardened. Continues Book 2's Projects 2 and 3."
readme = "README.md"
authors = [
    { name = "Sebuliba-Adrian", email = "adrian.sebuliba1@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.5.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langgraph>=1.2.11",
    "neo4j>=6.3.0",
    "openai>=3.13.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.13.5",
    "pyjwt[crypto]>=2.10.1",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.19.0",
    "reliable-agents-labs",
    "saq[postgres]>=0.26.4",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.53.0",
]

[tool.uv.sources]
reliable-agents-labs = { git = "https://github.com/Sebuliba-Adrian/reliable-agents-labs.git" }

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["backend/src/pkgintel_app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
